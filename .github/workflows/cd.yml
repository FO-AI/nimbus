name: CD

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Promotes the commit CI just published. scripts/cd.sh resolves the digests itself
  # from IMAGE_TAG; the wrapper owns checkout, the dev environment, concurrency, the
  # stale-main check, and Azure login.
  deploy:
    # workflow_run fires for every CI completion, including on branches and reruns of
    # other events. Only a successful CI on a push to main may deploy automatically.
    # A dispatch redeploys current main (allow-manual); it cannot deploy older commits.
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    permissions:
      contents: read
      id-token: write
    uses: FO-AI/automation/.github/workflows/deploy-azure.yml@v1
    with:
      environment: dev
      allow-manual: true
      deploy-command: bash scripts/cd.sh
    secrets: inherit
