name: Deploy (dev)

on:
  workflow_dispatch:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

concurrency:
  group: deploy-dev
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    uses: FO-AI/automation/.github/workflows/deploy-azure.yml@35d4c376f87a929c52af6eeac57a57d744404f10
    with:
      environment: dev
      allow-manual: true
      deploy-command: bash scripts/deploy.sh
      # The script reads repository/dev variables through DEPLOYMENT_VARS_JSON.
    secrets:
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      API_ENV_FILE: ${{ secrets.API_ENV_FILE }}
      WEB_ENV_FILE: ${{ secrets.WEB_ENV_FILE }}
