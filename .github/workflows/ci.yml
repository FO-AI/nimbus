name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    uses: FO-AI/automation/.github/workflows/ci.yml@eade7454d79be6d296018a1ca1af09dbba43fe4e
    with:
      checks: >-
        [
          {"name":"Frontend","directory":"apps/web","node-version":"20",
           "install":"npm ci",
           "run":"npm run lint && npm run typecheck && npm run test && npm run build"},
          {"name":"Backend","directory":"apps/api","python-version":"3.11",
           "install":"python -m pip install -e '.[dev]'",
           "run":"ruff check app && pytest",
           "env":{"AI_PROVIDER":"mock","AUTH_MODE":"disabled"}}
        ]
      containers: >-
        [
          {"name":"API","context":"apps/api","file":"apps/api/Dockerfile"},
          {"name":"Web","context":"apps/web","file":"apps/web/Dockerfile",
           "build-args":"NEXT_PUBLIC_API_BASE_URL=http://localhost:8000\nNEXT_PUBLIC_AUTH_DISABLED=false"}
        ]
