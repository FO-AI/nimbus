name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    uses: FO-AI/automation/.github/workflows/reusable-ci.yml@ca80da79c114cce45ebb115d6a165298ed6ea00d
    with:
      checks: >-
        [
          {"name":"Frontend","directory":"apps/web","node-version":"20",
           "install":"npm ci",
           "run":"bash ../../scripts/ci-frontend.sh"},
          {"name":"Backend","directory":"apps/api","python-version":"3.11",
           "install":"python -m pip install -e '.[dev]'",
           "run":"bash ../../scripts/ci-backend.sh",
           "env":{"AI_PROVIDER":"mock","AUTH_MODE":"disabled"}}
        ]
      containers: >-
        [
          {"name":"Backend","context":"apps/api","file":"apps/api/Dockerfile"},
          {"name":"Frontend","context":"apps/web","file":"apps/web/Dockerfile",
           "build-args":"NEXT_PUBLIC_API_BASE_URL=http://localhost:8000\nNEXT_PUBLIC_AUTH_DISABLED=false"}
        ]
